<!-- @ai-modified 2026-07-02 add user create/edit form -->
{{define "content"}}
<div class="mx-auto max-w-xl">
    <h1 class="text-2xl font-bold tracking-tight">{{.Title}}</h1>

    <form method="POST"
          action="{{with .Data.EditUser}}/users/{{.ID}}{{else}}/users{{end}}"
          class="mt-6 space-y-4 rounded-lg bg-white p-6 shadow">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div>
            <label for="full_name" class="block text-sm font-medium">Full name</label>
            <input id="full_name" name="full_name" type="text" value="{{.Form.full_name}}"
                   class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
            {{with .Errors.full_name}}<p class="mt-1 text-sm text-red-600">{{.}}</p>{{end}}
        </div>

        <div>
            <label for="email" class="block text-sm font-medium">Email</label>
            <input id="email" name="email" type="email" value="{{.Form.email}}"
                   class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
            {{with .Errors.email}}<p class="mt-1 text-sm text-red-600">{{.}}</p>{{end}}
        </div>

        <div>
            <label for="password" class="block text-sm font-medium">
                Password {{if .Data.EditUser}}<span class="text-gray-400">(leave blank to keep)</span>{{end}}
            </label>
            <input id="password" name="password" type="password"
                   class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
            {{with .Errors.password}}<p class="mt-1 text-sm text-red-600">{{.}}</p>{{end}}
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="role" class="block text-sm font-medium">Role</label>
                <select id="role" name="role"
                        class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
                    {{range $role := .Data.Roles}}
                    <option value="{{$role}}" {{if eq $.Form.role $role}}selected{{end}} class="capitalize">{{$role}}</option>
                    {{end}}
                </select>
                {{with .Errors.role}}<p class="mt-1 text-sm text-red-600">{{.}}</p>{{end}}
            </div>
            <div>
                <label for="store_id" class="block text-sm font-medium">Store <span class="text-gray-400">(optional)</span></label>
                <select id="store_id" name="store_id"
                        class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
                    <option value="">— none —</option>
                    {{range $s := .Data.Stores}}
                    <option value="{{$s.ID}}" {{if eq $.Form.store_id (printf "%d" $s.ID)}}selected{{end}}>{{$s.Name}}</option>
                    {{end}}
                </select>
            </div>
        </div>

        <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" name="is_active" {{if eq .Form.is_active "on"}}checked{{end}}
                   class="rounded ring-1 ring-gray-300">
            Active
        </label>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Save</button>
            <a href="/users" class="rounded-md px-4 py-2 text-sm ring-1 ring-gray-300 hover:bg-gray-50">Cancel</a>
        </div>
    </form>
</div>
{{end}}
