{{define "content"}}
<div class="mx-auto max-w-xl">
    <h1 class="text-2xl font-bold tracking-tight">{{.Title}}</h1>

    <form method="POST"
          action="{{with .Data.Supplier}}/suppliers/{{.ID}}{{else}}/suppliers{{end}}"
          class="mt-6 space-y-4 rounded-lg bg-white p-6 shadow">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div>
            <label for="name" class="block text-sm font-medium">Name</label>
            <input id="name" name="name" type="text" value="{{.Form.name}}"
                   class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
            {{with .Errors.name}}<p class="mt-1 text-sm text-red-600">{{.}}</p>{{end}}
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="contact_person" class="block text-sm font-medium">Contact person</label>
                <input id="contact_person" name="contact_person" type="text" value="{{.Form.contact_person}}"
                       class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium">Phone</label>
                <input id="phone" name="phone" type="text" value="{{.Form.phone}}"
                       class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <div>
            <label for="email" class="block text-sm font-medium">Email</label>
            <input id="email" name="email" type="text" value="{{.Form.email}}"
                   class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
            {{with .Errors.email}}<p class="mt-1 text-sm text-red-600">{{.}}</p>{{end}}
        </div>

        <div>
            <label for="address" class="block text-sm font-medium">Address</label>
            <textarea id="address" name="address" rows="2"
                      class="mt-1 block w-full rounded-md px-3 py-2 ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">{{.Form.address}}</textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Save</button>
            <a href="/suppliers" class="rounded-md px-4 py-2 text-sm ring-1 ring-gray-300 hover:bg-gray-50">Cancel</a>
        </div>
    </form>
</div>
{{end}}
