{{define "content"}}
<div class="mx-auto mt-16 w-full max-w-sm">
    <h1 class="text-center text-2xl font-bold tracking-tight">🏬 Mall Stock</h1>
    <p class="mt-1 text-center text-sm text-gray-500">Sign in to your account</p>

    {{with .Errors.login}}
    <div class="mt-6 rounded-md bg-red-50 p-4 text-sm text-red-800 ring-1 ring-red-200">{{.}}</div>
    {{end}}

    <form method="POST" action="/login" class="mt-6 space-y-4 rounded-lg bg-white p-6 shadow">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div>
            <label for="email" class="block text-sm font-medium">Email</label>
            <input id="email" name="email" type="email" required autofocus value="{{.Form.email}}"
                   class="mt-1 block w-full rounded-md border-gray-300 px-3 py-2 shadow-sm ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium">Password</label>
            <input id="password" name="password" type="password" required
                   class="mt-1 block w-full rounded-md px-3 py-2 shadow-sm ring-1 ring-gray-300 focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
                class="w-full rounded-md bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-500">
            Log in
        </button>
    </form>
</div>
{{end}}
